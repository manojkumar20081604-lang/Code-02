<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Circle face -->
  <circle cx="128" cy="110" r="55" fill="none" stroke="white" stroke-width="6" filter="url(#glow)"/>
  <!-- Eyes -->
  <circle cx="108" cy="100" r="8" fill="white" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="100" r="8" fill="white" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Antenna -->
  <line x1="128" y1="55" x2="128" y2="35" stroke="white" stroke-width="4" filter="url(#glow)"/>
  <circle cx="128" cy="28" r="10" fill="white" filter="url(#glow)">
    <animate attributeName="r" values="10;12;10" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Mouth -->
  <path d="M105 125 Q128 145 151 125" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- 02 Text -->
  <text x="128" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)">02</text>
</svg>
